<div class="flex justify-between px-3 items-center my-5">
	<h2 class="text-xl font-semibold  text-primary-500 px-0">
		{{ title }}
	</h2>
	<button mat-icon-button aria-label="close dialog" mat-dialog-close class="text-primary-500">
		<mat-icon>close</mat-icon>
	</button>

</div>
<div class="px-8">

	<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
		<mat-form-field class="w-full">
			<input matInput [placeholder]="placeholder" formControlName="name" />
			<mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
		</mat-form-field>


		<div class="my-6 flex justify-end gap-2">
			<button type="submit" class="justify-center rounded-md  bg-green-500 px-4 py-2">
				create
			</button>
		</div>
	</form>

</div>
