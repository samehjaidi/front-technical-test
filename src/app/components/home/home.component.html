<div
	class="flex items-center justify-center min-h-screen bg-gradient-to-tr from-indigo-100 via-blue-100 to-indigo-200 p-4 sm:p-6">

	<div
		class="bg-white rounded-none sm:rounded-2xl shadow-xl p-6 sm:p-10 lg:p-12 w-full h-full sm:max-w-4xl flex flex-col items-center justify-center text-center">
		<div class="mb-6">
			<mat-icon class="text-6xl sm:text-7xl text-blue-500">folder</mat-icon>
		</div>
		<h1 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-gray-800 mb-4">
			Welcome to File Manager
		</h1>
		<p class="text-sm sm:text-base lg:text-lg text-gray-600 mb-8">
			Easily organize, upload, and manage all your files and folders in one place.
		</p>
		<button (click)="navigateToFolders()"
			class="cursor-pointer inline-block px-6 sm:px-8 py-2 sm:py-3 text-sm sm:text-lg font-semibold rounded-full bg-blue-600 text-white shadow-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition duration-200">
			Get Started
		</button>
		<p class="mt-10 text-xs sm:text-sm text-gray-400">
			&copy; 2025 Jaidi Sameh
		</p>

	</div>
</div>
